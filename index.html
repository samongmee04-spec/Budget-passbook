<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>สมุดบัญชีของฉัน</title>
<meta name="description" content="แอปบันทึกรายรับ รายจ่าย และเงินออมส่วนตัว" />
<meta name="theme-color" content="#163B2C" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="สมุดบัญชี" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" />

<style>
  html, body { margin:0; padding:0; }
  :root {
    --paper: #F7F3E8; --paper-alt: #FBF8EF; --cover: #163B2C; --cover-light: #1F5240;
    --ink: #2B2B26; --ink-soft: #6B6656; --gold: #C9972B; --red: #B23A2E; --teal: #2F7A6B; --line: #D8CFB8;
  }
  .ledger-app * { box-sizing: border-box; }
  .ledger-app { font-family: 'Noto Sans Thai', sans-serif; background: var(--paper); color: var(--ink);
    min-height: 100vh; padding-bottom: 24px; }
  .ledger-mono { font-family: 'JetBrains Mono', monospace; }
  .muted { color: var(--ink-soft); }
  .teal-text { color: var(--teal); }
  .red-text { color: var(--red); }

  .app-header { background: linear-gradient(160deg, var(--cover), var(--cover-light));
    color: var(--paper-alt); padding: max(22px, env(safe-area-inset-top)) 18px 16px; border-bottom: 4px double var(--gold); }
  .app-title { font-family: 'Noto Serif Thai', serif; font-weight: 700; font-size: 22px; margin: 0; letter-spacing: .3px; }
  .app-sub { font-size: 12px; opacity: .75; margin-top: 2px; font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; text-transform: uppercase; }

  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 16px;
    background: rgba(247,243,232,0.08); border: 1px solid rgba(201,151,43,0.4); border-radius: 10px; padding: 6px 10px; }
  .month-nav button { background: none; border: none; color: var(--gold); cursor: pointer; padding: 6px; display: flex; }
  .month-label { font-family: 'Noto Serif Thai', serif; font-size: 16px; font-weight: 600; }

  .tabs { display: flex; gap: 4px; padding: 10px 14px 0; position: sticky; top: 0; background: var(--paper); z-index: 5; }
  .tab-btn { flex: 1; padding: 10px 3px; text-align: center; font-size: 11.5px; font-weight: 600; cursor: pointer;
    background: var(--paper-alt); border: 1px solid var(--line); border-bottom: none; border-radius: 10px 10px 0 0;
    color: var(--ink-soft); display: flex; align-items: center; justify-content: center; gap: 5px; }
  .tab-btn.active { background: var(--paper); color: var(--cover); border-color: var(--gold); position: relative; top: 1px; }

  .tab-body { padding: 14px; display: flex; flex-direction: column; gap: 14px; max-width: 720px; margin: 0 auto; padding-bottom: 40px; }

  .ledger-card { background: var(--paper-alt); border: 1px solid var(--line); border-radius: 4px; padding: 16px;
    position: relative; box-shadow: 0 1px 0 var(--line); }
  .ledger-card::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px;
    background: repeating-linear-gradient(180deg, var(--gold) 0 6px, transparent 6px 12px); opacity: .5; }
  .card-title { font-family: 'Noto Serif Thai', serif; font-size: 15px; font-weight: 700; margin: 0 0 12px;
    color: var(--cover); display: flex; align-items: center; }
  .card-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }

  .overview-grid { display: flex; flex-direction: column; gap: 10px; }
  .stat-list { display: flex; flex-direction: column; gap: 8px; }
  .stat-row { display: flex; justify-content: space-between; font-size: 14px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }

  .field-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .field-grid.two-col { grid-template-columns: 1fr 1fr; }
  .field-row { display: flex; align-items: center; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .field-label { font-size: 12.5px; flex: 1; border-left: 3px solid; padding-left: 6px; color: var(--ink); }
  .ledger-input { width: 90px; border: none; background: transparent; text-align: right; font-family: 'JetBrains Mono', monospace;
    font-size: 13px; color: var(--ink); outline: none; border-bottom: 1px solid var(--line); }
  .ledger-input:focus { border-color: var(--gold); }

  .fixed-table { display: flex; flex-direction: column; gap: 4px; }
  .fixed-head, .fixed-row { display: grid; grid-template-columns: 1.4fr .9fr 1fr .9fr; gap: 6px; align-items: center; font-size: 12.5px; padding: 5px 2px; }
  .fixed-head { color: var(--ink-soft); font-weight: 600; border-bottom: 1px solid var(--line); }
  .fixed-row { border-bottom: 1px dashed var(--line); }
  .fixed-row .ledger-input { width: 100%; text-align: right; }
  .fixed-total { border-top: 2px solid var(--gold); border-bottom: none; font-weight: 700; margin-top: 4px; }

  .day-select { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--paper); font-size: 12.5px; }
  .day-budget-row { display: flex; justify-content: space-between; font-size: 12.5px; background: var(--paper);
    border: 1px dashed var(--line); border-radius: 6px; padding: 6px 10px; margin-bottom: 10px; }

  .reset-btn { margin-top: 10px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; color: var(--ink-soft); cursor: pointer; }

  .dow-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 11px;
    color: var(--ink-soft); margin-bottom: 4px; font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .cal-cell { aspect-ratio: 1; min-width: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--paper);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; position: relative; padding: 1px; overflow: hidden; }
  .cal-cell.empty { border: none; background: none; }
  .cal-cell.weekend { background: #F1EAD6; }
  .cal-day { font-size: clamp(9px, 3vw, 11px); font-weight: 600; color: var(--ink-soft); }
  .cal-amount { font-size: clamp(7px, 2vw, 8.5px); white-space: nowrap; }
  .stamp { font-family: 'Noto Serif Thai', serif; font-size: clamp(6.5px, 2vw, 8.5px); font-weight: 700; border: 1.5px dashed;
    border-radius: 50%; width: clamp(18px, 22%, 26px); height: clamp(18px, 22%, 26px); display: flex; align-items: center; justify-content: center;
    transform: rotate(-12deg); }
  .stamp-green { color: var(--teal); border-color: var(--teal); }
  .stamp-red { color: var(--red); border-color: var(--red); }
  .cal-legend { display: flex; gap: 16px; font-size: 11.5px; margin-top: 10px; color: var(--ink-soft); }
  .cal-legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .dot.green { background: var(--teal); } .dot.red { background: var(--red); }

  .summary-list { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }

  .noscript-fallback { display: flex; align-items: center; justify-content: center; min-height: 100vh;
    font-family: sans-serif; color: #6B6656; text-align: center; padding: 20px; }

  @media (min-width: 640px) { .field-grid { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div id="root">
  <div class="noscript-fallback">กำลังโหลดแอป... หากหน้าจอนี้ค้างนานเกิน 10 วินาที กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองรีเฟรชอีกครั้ง</div>
</div>
<script src="bundle.js"></script>
<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function () {});
    });
  }
</script>
</body>
</html>
